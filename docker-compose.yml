services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: insightflow_ai_db
      POSTGRES_USER: insightflow
      POSTGRES_PASSWORD: insightflow-dev-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightflow -d insightflow_ai_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://insightflow:insightflow-dev-password@db:5432/insightflow_ai_db
      APP_ENV: development
      APP_SECRET_KEY: local-development-secret-change-me
      AUTO_CREATE_SCHEMA: "true"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
